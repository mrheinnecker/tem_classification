# nf-core/ampliseq 2.18.0 pilot parameters.
# Replace all REPLACE_ME values before submission.

input: "REPLACE_ME_WITH_ABSOLUTE_PATH/ampliseq_samplesheet.tsv"
outdir: "REPLACE_ME_WITH_ABSOLUTE_PATH/ampliseq_pilot_results"

# Biological amplicon primers only, written 5' to 3'. Do not include Illumina
# adapters, indices, pads, linkers, heterogeneity spacers, or barcodes.
FW_primer: "GTGYCAGCMGCCGCGGTAA"
RV_primer: "CCGYCAATTYMTTTRAGTTT"

# The observed FASTQ quality characters correspond to binned Phred scores.
binned_quality: "2,11,25,37"

# First validate trimming, orientation, merging, and ASV inference. The stock
# SILVA classifier is not suitable for the eukaryotic fraction of these data.
skip_taxonomy: true

# Resource ceilings for individual pipeline processes; adjust to cluster policy.
max_cpus: 16
max_memory: "64.GB"
max_time: "48.h"

# Keep failed-sample detection strict during the pilot.
min_read_counts: 1
ignore_empty_input_files: false
ignore_failed_trimming: false
